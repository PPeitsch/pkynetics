# Validation registry: which numerical methods have been checked against real data,
# how, and with what result. See "Validating a numerical method" in AGENTS.md.
#
# One entry per method. The registry is the source of truth; nothing is repeated in
# docstrings, where it would drift.
#
#   id        short stable name
#   target    import path of the public function or class
#   files     extra source files the result depends on (the target's own file is
#             always included); used to tell whether the code changed since `commit`
#   status    validated | issues | failed | pending
#               validated  checked with script + plots + maintainer review; correct
#               issues     works, with known problems (linked in `evidence`)
#               failed     gives wrong results; do not rely on it
#               pending    not validated yet
#   date      date of the last validation
#   commit    commit the validation ran against
#   data      data sets used
#   how       what was run and looked at
#   evidence  issues / PRs where the numbers and plots are recorded
#   notes     what was found, limits of validity
#
# `python tests/test_validation_registry.py` prints the status of every entry and flags
# the validated ones whose files changed since their commit: those, and only those,
# need validating again.

- id: smoothing
  target: pkynetics.data_preprocessing.smooth_data
  status: validated
  date: 2026-09-25
  commit: 40958fc
  data: [dsc_setaram heating ramp, zry4 cooling, synthetic sine with a step in sampling density]
  how: >
    Script plotting savgol, moving_average and lowess on real data, the moving-average
    edges before/after PR #113, and lowess against x vs against the index. Plots 1-3
    reviewed by the maintainer on 2026-09-25.
  evidence: ["issue #47", "PR #113"]
  notes: >
    Moving-average edges no longer pulled toward zero. Lowess against x beats the index
    by 10-30 % only next to a change in sampling density. Any smoother flattens peaks
    when the window is not small relative to the curvature of the feature (lowess, 21
    points spanning 1/3 of a period: error 0.16 at the peaks, 0.004 with 7 points).
    Review: the new moving average sits on the raw DSC signal, edges included; on the
    Zry-4 cooling minimum, moving_average and savgol show a small bias in the zoom,
    judged acceptable.

- id: dilatometry.strain_derivative
  target: pkynetics.technique_analysis.dilatometry.curve_features._strain_derivative
  status: validated
  date: 2026-09-25
  commit: d8a2809
  data: [zry4 heating, zry4 cooling, "synthetic sigmoid: 20 seeds, 5 sampling scenarios"]
  how: >
    Compared against local polynomial regression against T (uniform, tricube, robust),
    windows swept 6-60 K; derivative RMSE against the known answer; detected limits
    against the window. Plots reviewed by the maintainer.
  evidence: ["issue #112", "PR #114"]
  notes: >
    No alternative estimator does better; tricube is this with a ~1.3x wider window.
    Weak spot: an abrupt change of ramp rate (doubles the error around the step);
    analyse constant-rate segments separately.

- id: dilatometry.detection.derivative
  target: pkynetics.technique_analysis.dilatometry.derivative_limits
  files: [src/pkynetics/technique_analysis/dilatometry/utilities.py]
  status: issues
  date: 2026-09-25
  commit: 9d3de94
  data: [zry4 heating, zry4 cooling]
  how: >
    Limits against the margin (0.08-0.35, step 0.01) and the window (6-60 K), before
    and after the run-selection fix, on both runs; a plot of the mechanism at margin
    0.16. Plots reviewed by the maintainer on 2026-09-25 (issue #115, step 1).
  evidence: ["issue #112", "issue #115", "PR #117"]
  notes: >
    Validated: the transformation is the run over the threshold carrying the most
    deviation. The longest run could be the pre-transformation stretch (the two
    baselines differ in slope), which caused the margin "dead zones" of issue #26;
    margins 0.10-0.24 now all give 833-840 / 935-937 degC on the heating run.
    Still open (issue #115, steps 2-3): the 3*MAD noise term puts the threshold at
    8-12 % of the peak instead of 5 %, moving both limits inward; past a margin of
    ~0.25 the baselines reach into the transformation.


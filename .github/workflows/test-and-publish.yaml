name: Test and Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Check formatting with Black
        run: black --check src/pkynetics tests --exclude "_version.py"

      - name: Check imports with isort
        run: isort --check-only src/pkynetics tests

      - name: Run type checker
        run: mypy

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and the docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # -W turns warnings into errors: a page missing from a toctree, a
      # broken reference or a malformed docstring fails here instead of
      # silently shipping a half-built site to ReadTheDocs
      - name: Build the documentation
        run: sphinx-build -b html -W docs docs/_build/html

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=pkynetics --cov-report=xml --junitxml=junit.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  minimum-versions:
    name: Tests - lowest supported dependencies
    runs-on: ubuntu-latest

    # pyproject declares floors (numpy>=1.24.3, pandas>=2.0.3, ...) that
    # nothing ever exercised: `pip install .` resolves to the newest release,
    # so code or tests using a newer API still pass. This job installs the
    # floors, which is what makes the declared range true.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Pinned in the same command as the package, so pip resolves the whole
    # set at once instead of installing the newest and downgrading after
    - name: Install the declared minimum dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev] \
          "numpy==1.24.3" \
          "pandas==2.0.3" \
          "scipy==1.10.1" \
          "matplotlib==3.7.5" \
          "statsmodels==0.14.1" \
          "chardet==5.0.0"

    - name: Show what got installed
      run: pip list

    - name: Run tests
      run: python -m pytest tests/ -q

  package:
    name: Build and test the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python -m build makes the sdist and then the wheel *from the sdist*,
      # so a sdist without the code yields an empty wheel and the tests fail
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the sdist contains the package
        run: |
          n=$(tar tzf dist/*.tar.gz | grep -c '/src/pkynetics/.*\.py$')
          echo "sdist has $n modules"
          test "$n" -gt 10

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl pytest
          # Run from outside the checkout so src/ cannot shadow the wheel
          cp -r tests /tmp/pkg-tests
          cd /tmp/pkg-tests
          /tmp/venv/bin/python -c "import pkynetics, sys; print(pkynetics.__file__); sys.exit('site-packages' not in pkynetics.__file__)"
          /tmp/venv/bin/python -m pytest -q -p no:cacheprovider -o addopts="" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [ test, code-quality, package ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pkynetics
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      # Publish exactly the distributions tested in the package job
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: false
